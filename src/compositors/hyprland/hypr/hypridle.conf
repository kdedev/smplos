# smplOS Hypridle Configuration
# Manages idle timeouts: screen lock, DPMS, suspend
#
# Flow: lock -> DPMS off -> suspend. Settings -> Power edits each timeout below
# in place, so durations are deliberately not repeated in comments (they would
# go stale and disagree with what Settings shows).
#
# Screen off always wins over the lock screen: locking never wakes the display.
# Monitors that are already off stay off until the next key press or mouse move
# (Hyprland wakes them on input), with hyprlock already in front of the desktop.
# Only the wake after suspend turns them on again, after the re-lock below.
#
# CONTRACT: Settings only saves what it recognizes. Keep every `on-timeout` a
# lock, screen-off, suspend or poweroff command, and `after_sleep_cmd` an
# optional re-lock followed by `smplos-hypr-dpms on`, `hyprctl reload` and
# `sleep N` steps. Anything else makes Settings refuse to save.
#
# On wake: RE-LOCK (in case hyprlock lost the screen across suspend), let it
# paint, THEN turn the display on — so the desktop is never revealed unlocked.
#
# Why re-lock on resume: `before_sleep_cmd` triggers the lock asynchronously,
# but logind only holds suspend for InhibitDelayMaxSec (~5s). On nvidia,
# hyprlock can fail to grab the screen within that window (or die across the
# suspend), so suspend proceeds unlocked. Re-locking in `after_sleep_cmd`
# before DPMS-on guarantees a password prompt on every wake.
#
# NOTE: DPMS off and suspend are disabled inside VMs (QEMU/KVM/VirtualBox)
# because virtual displays can't handle DPMS wake and VM suspend is
# unrecoverable without ACPI passthrough.
#
# NOTE: every listener sets `ignore_inhibit = true`. Chromium/Electron apps
# (Brave, Signal, Discord, ...) hold a persistent Wayland idle-inhibitor even
# when nothing is playing, which would otherwise stop the screen from ever
# locking/blanking/suspending. ignore_inhibit makes idle purely input-based
# (fires on real keyboard/mouse inactivity). Trade-off: fullscreen video that
# receives no input will also time out — nudge the mouse to keep it awake.
#
# NOTE (nvidia DPMS wake): on nvidia + Hyprland, `dpms on` toggles the CRTC
# power property but does NOT force a new page-flip. If every visible client is
# idle (VS Code, terminal — no repaints), the backlight comes back but the
# scanout stays whatever was last sent, and the panel shows black. Clients
# that keep committing frames (browser with a paused video, animations, etc.)
# work around it by accident. Empirically the reliable wake chain is:
#     dpms on  ->  hyprctl reload  ->  dpms on
# The first `dpms on` restores the CRTC, `hyprctl reload` forces a monitor
# reconfigure / full modeset, and the second `dpms on` covers the case where
# the first was a no-op because Hyprland thought the display was already on.

general {
    # Use the `lock-screen` wrapper (not bare hyprlock) so a post-unlock DPMS
    # cycle fires after successful authentication. Works around a nvidia-open
    # + Hyprland bug where the compositor regains DRM master after hyprlock
    # exits but never commits a new frame — screen stays black until the
    # machine is hard-power-cycled. See lock-screen for the recovery detail.
    lock_cmd = pidof hyprlock || lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = loginctl lock-session; sleep 0.5; smplos-hypr-dpms on; sleep 0.2; hyprctl reload; sleep 0.2; smplos-hypr-dpms on
}

# Lock screen (hyprlock shows password dialog)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    ignore_inhibit = true
}

# Screen off (hyprlock stays running underneath)
listener {
    timeout = 330
    on-timeout = systemd-detect-virt -q || smplos-hypr-dpms off
    # NOTE: on-resume intentionally omitted. Hyprland 0.56.0 upstream fix
    # (PR #14818, "compositor: fix monitor re-enabling on hotplug when
    # dpms is off") handles the post-DPMS-wake case cleanly on nvidia now,
    # so we don't need to auto-invoke screen-recover here anymore. If the
    # bug ever regresses on a specific driver combo, user can trigger
    # screen-recover manually via Super+Ctrl+D (emergency.conf).
    ignore_inhibit = true
}

# Suspend (skip in VMs)
listener {
    timeout = 600
    on-timeout = systemd-detect-virt -q || systemctl suspend
    ignore_inhibit = true
}
