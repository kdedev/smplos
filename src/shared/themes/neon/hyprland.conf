# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgba(00f0ffff) rgba(2f7bffff) rgba(00f0ffff) 45deg
$inactiveBorderColor = rgba(0b8a9acc) rgba(0b3f66cc) 45deg

# Decoration overrides (theme-controlled)
$themeRounding = 42
$themeRoundingPower = 1.0
$themeGapsIn = 18
$themeGapsOut = 24
$themeBorderSize = 2
$themeBlurSize = 12
$themeBlurPasses = 3
$themeOpacityActive = 0.85
$themeOpacityInactive = 0.85
$themePopupOpacity = 0.85
$themeMessengerOpacity = 0.85
$themeBrowserOpacity = 0.85

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 30
$themeShadowRenderPower = 2
$themeShadowColor = rgba(8a6bff88)
$themeShadowColorInactive = rgba(8a6bff34)
$themeGlow = 1
$themeGlowRange = 12
$themeGlowRenderPower = 3
$themeGlowColor = rgba(a98bffb0) rgba(7b6bff80) 45deg
$themeGlowColorInactive = rgba(a98bff50)
$themeBorderAnimation = 1

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 1
$themeHudStyle = scifi
$themeHudGap = 6
$themeHudChamfer = 10
$themeHudLineWidth = 3
$themeHudFloatGlowRange = 24
$themeHudSweep = 1
$themeHudSweepSpeed = 70
$themeHudSweepLength = 180
$themeHudHideBorder = 0
$themeHudGlyphColor = none
