# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgba(ffc233ff) rgba(ff9a1fff) rgba(ffc233ff) 45deg
$inactiveBorderColor = rgba(b87a1ecc) rgba(6e430fcc) 45deg

# Decoration overrides (theme-controlled)
$themeRounding = 42
$themeRoundingPower = 1.0
$themeGapsIn = 24
$themeGapsOut = 34
$themeBorderSize = 2
$themeBlurSize = 12
$themeBlurPasses = 3
$themeOpacityActive = 0.85
$themeOpacityInactive = 0.85
$themePopupOpacity = 0.85
$themeMessengerOpacity = 0.85
$themeBrowserOpacity = 0.85

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 30
$themeShadowRenderPower = 2
$themeShadowColor = rgba(ff6a1a88)
$themeShadowColorInactive = rgba(ff6a1a34)
$themeGlow = 1
$themeGlowRange = 10
$themeGlowRenderPower = 3
$themeGlowColor = rgba(ff7a2fb0) rgba(ff5a1f80) 45deg
$themeGlowColorInactive = rgba(ff7a2f50)
$themeBorderAnimation = 0

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 1
$themeHudStyle = panel
$themeHudGap = 15
$themeHudChamfer = 10
$themeHudLineWidth = 2
$themeHudFloatGlowRange = 14
$themeHudSweep = 1
$themeHudSweepSpeed = 60
$themeHudSweepLength = 180
$themeHudHideBorder = 0
$themeHudGlyphColor = none
