# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgb(7d82d9) rgb(c89dc1) 45deg
$inactiveBorderColor = rgba(6d7db6aa)

# Decoration overrides (theme-controlled)
$themeRounding = 3
$themeRoundingPower = 2.0
$themeGapsIn = 2
$themeGapsOut = 4
$themeBorderSize = 3
$themeBlurSize = 14
$themeBlurPasses = 3
$themeOpacityActive = 0.75
$themeOpacityInactive = 0.75
$themePopupOpacity = 0.75
$themeMessengerOpacity = 0.75
$themeBrowserOpacity = 0.75

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 2
$themeShadowRenderPower = 3
$themeShadowColor = rgba(1a1a1aee)
$themeShadowColorInactive = rgba(1a1a1aee)
$themeGlow = 0
$themeGlowRange = 10
$themeGlowRenderPower = 3
$themeGlowColor = rgba(7d82d9b0)
$themeGlowColorInactive = rgba(7d82d9b0)
$themeBorderAnimation = 0

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 0
$themeHudStyle = scifi
$themeHudGap = 5
$themeHudChamfer = 10
$themeHudLineWidth = 3
$themeHudFloatGlowRange = 0
$themeHudSweep = 0
$themeHudSweepSpeed = 80
$themeHudSweepLength = 180
