# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgb(89b4fa) rgb(a6e3a1) 45deg
$inactiveBorderColor = rgba(585b70aa)

# Decoration overrides (theme-controlled)
$themeRounding = 8
$themeRoundingPower = 2.0
$themeGapsIn = 6
$themeGapsOut = 10
$themeBorderSize = 4
$themeBlurSize = 14
$themeBlurPasses = 3
$themeOpacityActive = 0.50
$themeOpacityInactive = 0.50
$themePopupOpacity = 0.50
$themeMessengerOpacity = 0.50
$themeBrowserOpacity = 0.50

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 2
$themeShadowRenderPower = 3
$themeShadowColor = rgba(1a1a1aee)
$themeShadowColorInactive = rgba(1a1a1aee)
$themeGlow = 0
$themeGlowRange = 10
$themeGlowRenderPower = 3
$themeGlowColor = rgba(89b4fab0)
$themeGlowColorInactive = rgba(89b4fab0)
$themeBorderAnimation = 0

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 0
$themeHudStyle = scifi
$themeHudGap = 5
$themeHudChamfer = 10
$themeHudLineWidth = 3
$themeHudFloatGlowRange = 0
$themeHudSweep = 0
$themeHudSweepSpeed = 80
$themeHudSweepLength = 180
$themeHudHideBorder = 0
$themeHudGlyphColor = none
$themeHudSideOpacity = 1
$themeHudEdgeOpacity = 1
$themeHudUnderglow = 0
$themeHudScanner = 0
$themeHudScannerBlur = 1
