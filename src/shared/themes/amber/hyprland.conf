# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgb(FFA033)
$inactiveBorderColor = rgba(C77F33aa)

# Decoration overrides (theme-controlled)
$themeRounding = 4
$themeRoundingPower = 2.0
$themeGapsIn = 1
$themeGapsOut = 2
$themeBorderSize = 1
$themeBlurSize = 0
$themeBlurPasses = 0
$themeOpacityActive = 1.0
$themeOpacityInactive = 1.0
$themePopupOpacity = 1.0
$themeMessengerOpacity = 1.0
$themeBrowserOpacity = 1.0

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 2
$themeShadowRenderPower = 3
$themeShadowColor = rgba(1a1a1aee)
$themeShadowColorInactive = rgba(1a1a1aee)
$themeGlow = 0
$themeGlowRange = 10
$themeGlowRenderPower = 3
$themeGlowColor = rgba(FFA033b0)
$themeGlowColorInactive = rgba(FFA033b0)
$themeBorderAnimation = 0

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 0
$themeHudStyle = scifi
$themeHudGap = 5
$themeHudChamfer = 10
$themeHudLineWidth = 3
$themeHudFloatGlowRange = 0
$themeHudSweep = 0
$themeHudSweepSpeed = 80
$themeHudSweepLength = 180
