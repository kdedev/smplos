# Matrix HUD: the Matrix palette in a sci-fi panel frame. Near-black green glass
# panels in octagonal windows, each wrapped in a notched green outline with
# glowing circuit traces. Where Amber HUD runs dots along the lines, this theme
# runs Matrix characters: streams of them rain along the outline and the traces,
# and a character at the end of each trace pulses slowly (Hyprland effects and
# the smpl-hud plugin; see "Window effects"). Without the plugin the windows keep
# their glowing green border.

# -- Backgrounds --
background = "#020a04"
bg_light = "#0D1A0D"
bg_lighter = "#1A2E1A"
surface = "#0D1A0D"

# -- Foregrounds --
foreground = "#00FF00"
fg_dim = "#66FF66"
fg_alt = "#00FF00"
muted = "#55BB55"
autosuggestion = "#4DDD4D"

# -- Interactive --
accent = "#00FF00"
accent_alt = "#FF9900"
cursor = "#66FF66"
selection_foreground = "#020a04"
selection_background = "#66FF66"

# -- Status --
danger = "#FF9900"
success = "#00FF00"
warning = "#FFCC33"
info = "#33FFAA"

# -- Bright Variants (terminal palette + btop gradients) --
danger_bright = "#FFCC33"
success_bright = "#66FF66"
warning_bright = "#FFEE66"
accent_bright = "#55FFAA"
accent_alt_bright = "#FFBB33"
info_bright = "#77FFCC"

# -- Terminal Palette Overrides --
# term_4 differs from accent for this theme
term_4 = "#22BB55"

# -- Decoration --
# rounding_power 1 turns rounding into straight 45 degree cuts (legs of
# rounding / 2 - 1 = 20 px): every window is an octagon, like the frame around it.
rounding = "42"
rounding_power = "1.0"
# Rofi, the Nemo quick preview and niri can only round circularly: a small
# radius keeps their corners nearly square, so Hyprland's cuts stay the corner shape.
app_rounding = "2"
blur_size = "12"
blur_passes = "3"
opacity_active = "0.85"
opacity_inactive = "0.85"
term_opacity_active = "0.80"
term_opacity_inactive = "0.70"
popup_opacity = "0.85"
app_background_opacity = "0.85"
messenger_opacity = "0.85"
browser_opacity = "0.85"

# -- Layout --
# The panel frame stands 15 px off the window, so the gaps are wide: neighbouring
# outlines sit 2 * (gaps_in + border_size) - 2 * hud_gap = 22 px apart, enough
# for their characters and halos to stay separate, and the outer gap leaves the
# outline and its traces room at the screen edge.
gaps_in = "24"
gaps_out = "34"
border_size = "2"
border_active = "rgba(b8ffd0ff) rgba(1fe86aff) rgba(00c8b4ff) 45deg"
border_inactive = "rgba(22a653cc) rgba(0f6a38cc) 45deg"

# -- Window effects (Hyprland only; all optional, see CREATING_MODIFYING_A_THEME.md) --
# The frame (border, outline, traces, characters) shades from mint white through
# green to teal along its diagonal; the glow (shadow, inner glow, halos around the
# outline) is a deeper emerald to aqua: the same green palette, so the two read
# as separate layers. The native
# glow is 10 px; the smpl-hud plugin draws the halos around the outline, 9 px on
# tiled windows and hud_float_glow_range on floating ones.
shadow_range = "30"
shadow_render_power = "2"
shadow_color = "rgba(00c96488)"
shadow_color_inactive = "rgba(00c96434)"
glow = "true"
glow_range = "10"
glow_render_power = "3"
glow_color = "rgba(00d48cb0) rgba(009cb880) 45deg"
glow_color_inactive = "rgba(00d48c50)"
# Off on purpose: the gradients stay put and the frame is animated by the
# characters and the travelling glow instead. A turning gradient recolours every
# piece of the frame at each step, and the plugin repaints those pieces when it does.
border_animation = "false"

# -- HUD frames (smpl-hud Hyprland plugin; see CREATING_MODIFYING_A_THEME.md) --
# Style "matrix": the notched outline of the "panel" style, with Matrix
# characters where that style has dots. The top and bottom edges step in and out,
# a ghost line fades out along the bottom, three circuit traces end in beads, and
# the bottom left corner is cut off. Windows that are too small for all of that
# get a plain chamfered outline. A character stands on the outline every few
# pixels, on a soft dark plate so the line breaks behind it. A bead at the end of
# each trace is a character that pulses slowly and changes as it fades in again;
# every now and then another one fades in along the outline and out again. Two
# streams of characters rain around the outline in opposite directions and one
# runs back and forth along each trace: a bright head with its characters fading
# behind it, glowing more as two streams near each other or a bead. A soft
# ellipse of light drifts slowly around the focused window's outline (about
# 60 px/s, the rain 1.6 times as fast), fading in and out as focus comes and
# goes. All of it is small cached sprites, repainted ~20 times a second only
# where it moves, and only while the window is visible.
# hud_gap is how far the outline stands off the window: the notches need at least 13.
hud_frame = "true"
hud_style = "matrix"
hud_gap = "15"
hud_line_width = "2"
hud_chamfer = "10"
hud_float_glow_range = "14"
hud_sweep = "true"
hud_sweep_speed = "60"
hud_sweep_length = "180"

# -- App Theme Selectors --
app_theme_nvim = "matrix"
app_theme_vscode = "matrix"
