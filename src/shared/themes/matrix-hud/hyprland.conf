# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgba(b8ffd0ff) rgba(1fe86aff) rgba(00c8b4ff) 45deg
$inactiveBorderColor = rgba(22a653cc) rgba(0f6a38cc) 45deg

# Decoration overrides (theme-controlled)
$themeRounding = 42
$themeRoundingPower = 1.0
$themeGapsIn = 28
$themeGapsOut = 34
$themeBorderSize = 0
$themeBlurSize = 12
$themeBlurPasses = 3
$themeOpacityActive = 0.85
$themeOpacityInactive = 0.85
$themePopupOpacity = 0.85
$themeMessengerOpacity = 0.85
$themeBrowserOpacity = 0.85

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 0
$themeShadowRenderPower = 2
$themeShadowColor = rgba(00c96488)
$themeShadowColorInactive = rgba(00c96434)
$themeGlow = 0
$themeGlowRange = 10
$themeGlowRenderPower = 3
$themeGlowColor = rgba(00d48cb0) rgba(009cb880) 45deg
$themeGlowColorInactive = rgba(00d48c50)
$themeBorderAnimation = 0

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 1
$themeHudStyle = matrix
$themeHudGap = 3
$themeHudChamfer = 10
$themeHudLineWidth = 2
$themeHudFloatGlowRange = 24
$themeHudSweep = 1
$themeHudSweepSpeed = 60
$themeHudSweepLength = 180
$themeHudHideBorder = 1
$themeHudGlyphColor = rgb(3cff28)
$themeHudSideOpacity = 0.1
