# smplOS Hyprland Theme — auto-generated from colors.toml
$activeBorderColor = rgb(e68e0d)
$inactiveBorderColor = rgba(8a8a8daa)

# Decoration overrides (theme-controlled)
$themeRounding = 3
$themeRoundingPower = 2.0
$themeGapsIn = 2
$themeGapsOut = 4
$themeBorderSize = 2
$themeBlurSize = 14
$themeBlurPasses = 3
$themeOpacityActive = 0.85
$themeOpacityInactive = 0.85
$themePopupOpacity = 0.85
$themeMessengerOpacity = 0.85
$themeBrowserOpacity = 0.85

# Window effects (optional; defaults = classic subtle shadow, no glow, static border)
$themeShadowRange = 2
$themeShadowRenderPower = 3
$themeShadowColor = rgba(1a1a1aee)
$themeShadowColorInactive = rgba(1a1a1aee)
$themeGlow = 0
$themeGlowRange = 10
$themeGlowRenderPower = 3
$themeGlowColor = rgba(e68e0db0)
$themeGlowColorInactive = rgba(e68e0db0)
$themeBorderAnimation = 0

# HUD frames (read by the smpl-hud Hyprland plugin; Hyprland ignores these)
$themeHudFrame = 0
$themeHudStyle = scifi
$themeHudGap = 5
$themeHudChamfer = 10
$themeHudLineWidth = 3
$themeHudFloatGlowRange = 0
$themeHudSweep = 0
$themeHudSweepSpeed = 80
$themeHudSweepLength = 180
$themeHudHideBorder = 0
