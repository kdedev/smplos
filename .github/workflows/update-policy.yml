name: Critical stack policy

on:
  pull_request:
    paths:
      - ".github/workflows/update-policy.yml"
      - "src/shared/update-policy/**"
      - "src/shared/bin/smplos-update"
      - "src/shared/bin/smplos-update-*"
      - "src/shared/bin/smplos-os-update"
      - "src/shared/bin/smplos-migrate"
      - "src/shared/lib/smplos-update-entry.sh"
      - "src/shared/lib/smplos-session-env.sh"
      - "src/fetch-apps.sh"
      - "src/fetch-org.sh"
      - "src/shared/bin/smplos-ensure-yay"
      - "src/shared/bin/heal-paru"
      - "src/shared/bin/rebuild-paru"
      - "src/shared/lib/smplos-pkgbuild.sh"
      - "src/shared/pkgbuilds/yay-bin/**"
      - "src/shared/packages-aur.txt"
      - "src/shared/installer/install.sh"
      - "src/shared/bin/bar-ctl"
      - "src/shared/lib/smplos-app-bundle.sh"
      - "src/shared/installer/automated_script.sh"
      - "migrations/**"
      - "tests/test_update_safety.py"
      - "tests/test_update_handoff.py"
      - "tests/test_yay_delivery.py"
      - "tests/test_app_delivery.py"
      - "tests/test_bar_ctl.py"
      - "tests/test_dropped_packages.py"
      - "tests/test_critical_bundle.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-policy.yml"
      - "src/shared/update-policy/**"
      - "src/shared/bin/smplos-update"
      - "src/shared/bin/smplos-update-*"
      - "src/shared/bin/smplos-os-update"
      - "src/shared/bin/smplos-migrate"
      - "src/shared/lib/smplos-update-entry.sh"
      - "src/shared/lib/smplos-session-env.sh"
      - "src/fetch-apps.sh"
      - "src/fetch-org.sh"
      - "src/shared/bin/smplos-ensure-yay"
      - "src/shared/bin/heal-paru"
      - "src/shared/bin/rebuild-paru"
      - "src/shared/lib/smplos-pkgbuild.sh"
      - "src/shared/pkgbuilds/yay-bin/**"
      - "src/shared/packages-aur.txt"
      - "src/shared/installer/install.sh"
      - "src/shared/bin/bar-ctl"
      - "src/shared/lib/smplos-app-bundle.sh"
      - "src/shared/installer/automated_script.sh"
      - "migrations/**"
      - "tests/test_update_safety.py"
      - "tests/test_update_handoff.py"
      - "tests/test_yay_delivery.py"
      - "tests/test_app_delivery.py"
      - "tests/test_bar_ctl.py"
      - "tests/test_dropped_packages.py"
      - "tests/test_critical_bundle.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shell syntax
        run: |
          for script in src/shared/bin/smplos-update src/shared/bin/smplos-os-update \
            src/shared/bin/smplos-migrate src/shared/lib/smplos-update-entry.sh \
            src/shared/lib/smplos-session-env.sh src/fetch-apps.sh src/fetch-org.sh \
            src/shared/bin/smplos-update-apps src/shared/bin/smplos-update-bootstrap src/shared/bin/bar-ctl \
            src/shared/bin/smplos-ensure-yay src/shared/bin/heal-paru src/shared/bin/rebuild-paru \
            src/shared/pkgbuilds/yay-bin/PKGBUILD src/shared/lib/smplos-pkgbuild.sh \
            src/shared/lib/smplos-app-bundle.sh src/shared/installer/automated_script.sh \
            src/shared/update-policy/critical-bundle.conf migrations/*.sh; do
            bash -n "$script" || exit 1
          done
      - name: Check one-transaction upgrades and the Hyprland series rule
        run: python3 -m unittest discover -s tests -p 'test_critical_bundle.py' -v
      - name: Check update safeguards, diagnostics and delivery
        run: |
          python3 -m unittest discover -s tests -p 'test_update_safety.py' -v
          python3 -m unittest discover -s tests -p 'test_update_handoff.py' -v
          python3 -m unittest discover -s tests -p 'test_yay_delivery.py' -v
          python3 -m unittest discover -s tests -p 'test_app_delivery.py' -v
          python3 -m unittest discover -s tests -p 'test_bar_ctl.py' -v
          python3 -m unittest discover -s tests -p 'test_dropped_packages.py' -v
